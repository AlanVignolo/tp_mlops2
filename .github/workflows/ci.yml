name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Lint with Ruff
        run: uv run ruff check .
    
      - name: Set up Kaggle credentials
        run: |
          mkdir -p ~/.kaggle
          echo '{"username":"${{ secrets.KAGGLE_USERNAME }}","key":"${{ secrets.KAGGLE_KEY }}"}' > ~/.kaggle/kaggle.json
          chmod 600 ~/.kaggle/kaggle.json

      - name: Download dataset
        run: |
          uv run kaggle datasets download -d nicholasjhana/energy-consumption-generation-prices-and-weather -p data/raw --unzip

      - name: Train model (quick mode)
        env:
          TP_MLOPS2_QUICK_TRAIN: "1"
        run: uv run python -m tp_mlops2.train

      - name: Start API
        run: |
          uv run uvicorn tp_mlops2.api.main:app --host 127.0.0.1 --port 8000 &
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:8000/health && break
            sleep 1
          done

      - name: Run tests
        run: uv run pytest tests/ -v